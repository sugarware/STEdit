<style>
:root{
  --app-bg:#f6f7f9;--panel:#fff;--line:#d8dce3;--text:#1f2937;--muted:#667085;--muted-strong:#475467;
  --accent:#2563eb;--accent-bg:#eaf1ff;--button-bg:#f1f5f9;--button-fg:#0f172a;--button-border:#cbd5e1;
  --button-active-bg:#dbeafe;--input-bg:#fff;--input-fg:#1f2937;

  --editor-font:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --editor-size:16px;--editor-fg:#1f2937;--editor-bg:#fff;--line-height:1.65;
  --gutter-bg:#f4f6f8;--gutter-fg:#7b8494;--cursor-line-bg:rgba(37,99,235,.09);--invisible-fg:#8b72b8;--search-hit-bg:rgba(250,204,21,.30);--search-current-bg:rgba(249,115,22,.38);--search-current-border:#f97316;--nav-cursor:var(--accent);--nav-hit:#eab308;--nav-current:#f97316;--active-pane:#3b82f6;
}
*{box-sizing:border-box}
html{height:100%;margin:0;overflow:hidden;background:var(--app-bg)}
body{position:relative;isolation:isolate;height:var(--visual-viewport-height,100dvh);max-height:var(--visual-viewport-height,100dvh);margin:0;font-family:var(--ui-font);font-size:var(--ui-size);color:var(--ui-fg);background:var(--app-bg);display:flex;flex-direction:column;overflow:hidden}
body::before{content:"";position:fixed;z-index:-1;inset:-100vh -100vw;background:var(--app-bg);pointer-events:none}
button,input,select,textarea{font:inherit}button{height:2.25em;border:1px solid var(--button-border);border-radius:7px;background:var(--button-bg);color:var(--button-fg);padding:0 10px;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button:disabled{opacity:.45}button.active{background:var(--button-active-bg);border-color:var(--accent);font-weight:700}button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
input[type=text],input[type=search],input[type=number],select{height:2.25em;border:1px solid var(--line);border-radius:7px;background:var(--input-bg);color:var(--input-fg);padding:0 8px}.hidden{display:none!important}
header{flex:0 0 auto;padding:calc(8px + env(safe-area-inset-top)) calc(10px + env(safe-area-inset-right)) 8px calc(10px + env(safe-area-inset-left));background:var(--ui-bg);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:7px}
.topbar{display:flex;align-items:center;gap:7px;min-width:0}#appTitle{font-size:1.05em;font-weight:700;white-space:nowrap;-webkit-user-select:none;user-select:none}#docTitle{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted-strong);font-weight:700}#dirtyMark{color:#dc2626;font-weight:900}.spacer{flex:1}.iconBtn{min-width:3em;padding:0 8px;font-weight:700}.historyIconBtn{width:3em;min-width:3em;padding:0;display:inline-flex;align-items:center;justify-content:center}.historyIconBtn svg{width:1.9em;height:1.9em;pointer-events:none;overflow:visible}.historyIconBtn .historyArc{fill:none;stroke:currentColor;stroke-width:3.2;stroke-linecap:round}.historyIconBtn .historyHead{fill:currentColor;stroke:none}
.searchPanel{display:flex;flex-direction:column;gap:6px}.searchRow,.replaceRow{display:flex;align-items:center;gap:6px}.searchInputWrap{position:relative;display:flex;flex:1;min-width:80px}.searchField{width:100%;min-width:80px;padding-right:2.2em!important}.clearInputBtn{position:absolute;right:2px;top:2px;width:2em;min-width:2em;height:calc(100% - 4px);padding:0;border:0;background:transparent;color:var(--muted-strong);font-weight:800}.searchResults{height:132px;min-height:72px;max-height:45vh;overflow:auto;border:2px solid transparent;border-radius:0;background:var(--input-bg);position:relative;font-size:var(--search-pane-size,14px);line-height:1.2}.searchResults.activePane{border-color:var(--active-pane);box-shadow:0 0 0 1px color-mix(in srgb,var(--active-pane) 35%,transparent)}.searchResultsInner{position:relative;min-height:100%}.searchResultItem{position:absolute;left:0;right:0;height:34px;padding:3px 9px;border-bottom:1px solid var(--line);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:pointer;line-height:1.2}.searchResultItem.current{background:var(--button-active-bg);font-weight:700}.searchResultLine{font-size:.78em;color:var(--muted)}.searchResultText{overflow:hidden;text-overflow:ellipsis}.searchEmpty{padding:12px;color:var(--muted);text-align:center}.paneResizeHandle{height:18px;cursor:ns-resize;touch-action:none;position:relative;background:transparent;border:0}.paneResizeHandle::after{content:"";position:absolute;left:0;right:0;top:4px;height:8px;background:color-mix(in srgb,var(--active-pane) 12%,transparent);border-top:1px solid color-mix(in srgb,var(--active-pane) 48%,transparent);border-bottom:1px solid color-mix(in srgb,var(--active-pane) 48%,transparent)}.paneResizeHandle::before{content:"";position:absolute;z-index:1;left:18%;right:18%;top:6px;height:5px;border-radius:4px;background:var(--active-pane);box-shadow:0 0 5px color-mix(in srgb,var(--active-pane) 70%,transparent)}.counter{min-width:5em;text-align:center;font-weight:8 .gutterNumber{position:absolute;left:0;right:0;padding-right:6px;text-align:right;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:calc(var(--editor-size) * .82);line-height:var(--line-height);font-variant-numeric:tabular-nums;color:var(--gutter-fg);white-space:nowrap}

.statusbar{position:absolute;z-index:10;left:0;right:0;bottom:0;min-height:32px;padding:6px 12px;display:flex;align-items:center;gap:12px;background:color-mix(in srgb,var(--editor-bg) 92%,transparent);border-top:1px solid var(--line);font-size:.82em;color:var(--muted);pointer-events:none}.statusbar span{white-space:nowrap}
.popupMenu{position:fixed;z-index:5600;min-width:230px;padding:6px;border:1px solid var(--line);border-radius:12px;background:var(--ui-bg);box-shadow:0 8px 24px rgba(0,0,0,.22)}.popupMenu .menuTitle{padding:7px 10px;font-weight:700;color:var(--muted);border-bottom:1px solid var(--line)}.popupMenu button{display:block;width:100%;height:auto;min-height:2.5em;text-align:left;border:0;background:transparent;color:inherit;padding:9px 11px}.popupMenu .menuFooter{display:flex;justify-content:flex-end;border-top:1px solid var(--line);padding:7px}.popupMenu .menuFooter button{width:auto;border:1px solid var(--button-border);background:var(--button-bg)}

.assistMenu{position:fixed;z-index:6200;min-width:250px;max-width:min(430px,calc(100vw - 20px));max-height:min(72vh,620px);overflow:auto;padding:8px;border:1px solid var(--line);border-radius:12px;background:var(--ui-bg);color:var(--ui-fg);box-shadow:0 12px 32px rgba(0,0,0,.32);-webkit-user-select:none;user-select:none}
.assistMenu .menuTitle{position:sticky;top:-8px;z-index:2;margin:-8px -8px 7px;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--ui-bg);font-weight:800}
.assistSection{margin:7px 0 10px}.assistSectionTitle{margin:0 2px 5px;color:var(--muted);font-size:.82em;font-weight:800}.assistGrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}.assistGrid button{height:2.5em;min-width:0;padding:0 6px;font-weight:700}.assistGrid .wide{grid-column:span 2}.assistGrid .full{grid-column:1/-1;text-align:left;padding:0 10px}.assistMenu .menuFooter{position:sticky;bottom:-8px;display:flex;justify-content:flex-end;margin:8px -8px -8px;padding:8px;border-top:1px solid var(--line);background:var(--ui-bg)}

.miniEditHeader{display:flex;align-items:center;gap:calc(5px * var(--mini-scale));height:calc(27px * var(--mini-scale));padding:0 2px calc(4px * var(--mini-scale));font-size:calc(11px * var(--mini-scale));color:var(--muted);cursor:move;touch-action:none}.miniEditHeader strong{color:var(--muted-strong);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.miniEditHeader .spacer{flex:1}.miniEditHeader button{height:calc(23px * var(--mini-scale));min-width:calc(31px * var(--mini-scale));padding:0 calc(6px * var(--mini-scale));font-size:calc(12px * var(--mini-scale))}.miniEditDragMark{font-size:1.25em;font-weight:900;color:var(--muted-strong)}
.miniEditGrid{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:calc(4px * var(--mini-scale))}.miniEditGrid button{height:calc(30px * var(--mini-scale));min-width:0;padding:0 calc(3px * var(--mini-scale));border-radius:5px;font-size:calc(13px * var(--mini-scale));font-weight:750}.miniEditGrid button.wide{grid-column:span 2}.miniEditGrid button.favorite{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.favoriteActionGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.favoriteActionGrid button{height:auto;min-height:2.6em;padding:5px}.favoriteActionGrid button.current{background:var(--button-active-bg);border-color:var(--accent);font-weight:900}
@media(max-width:480px){.miniEditGrid{grid-template-columns:repeat(6,minmax(0,1fr))}.miniEditKeyboard{max-width:calc(100vw - 6px)}.miniEditHeader strong{max-width:8em}}
.gesturePressed{filter:brightness(.92)}
.searchPaneHidden #searchResults,.searchPaneHidden #paneResizeHandle{display:none!important}
.overlay{position:fixed;inset:0;z-index:5000;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;padding:10px}.dialog{width:min(620px,100%);max-height:min(88vh,720px);overflow:auto;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:12px;box-shadow:0 16px 44px rgba(0,0,0,.3);padding:10px}.dialogHeader{position:sticky;z-index:5;top:-10px;display:flex;align-items:center;gap:8px;margin:-10px -10px 8px;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--panel)}.dialogHeader h2{flex:1;margin:0!important}.dialogTopClose{width:2.2em;min-width:2.2em;height:2.2em;padding:0;font-size:1.1em;font-weight:900}.dialog h2{font-size:1.05em;margin:0 0 8px}.dialog h3{font-size:.92em;margin:12px 0 6px;padding-top:8px;border-top:1px solid var(--line)}.settingGrid{display:grid;grid-template-columns:minmax(8em,1fr) minmax(9em,1.35fr);gap:7px 10px;align-items:center}.settingGrid select,.settingGrid input{width:100%}details.settingDetail{margin-top:8px;border:1px solid var(--line);border-radius:8px;padding:6px}details.settingDetail summary{cursor:pointer;font-weight:700}.dialogActions{display:flex;justify-content:flex-end;gap:7px;margin-top:10px;flex-wrap:wrap}.fileButtons{display:flex;gap:7px;flex-wrap:wrap}.numericPad{position:fixed;z-index:8000;left:50%;bottom:calc(8px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(270px,calc(100vw - 16px));padding:7px;border:1px solid var(--line);border-radius:11px;background:var(--panel);color:var(--text);box-shadow:0 12px 36px rgba(0,0,0,.35)}.numericPadDisplay{height:2.1em;border:1px solid var(--line);border-radius:7px;background:var(--input-bg);color:var(--input-fg);padding:5px 8px;text-align:right;font-size:1em;margin-bottom:5px;overflow:hidden}.numericPadGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.numericPadGrid button{height:2.35em;font-size:1em}.numericPadActions{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:4px}.numericPadActions button{height:2.25em}
@media(max-width:480px){.overlay{padding:5px;align-items:flex-start;padding-top:calc(5px + env(safe-area-inset-top))}.dialog{width:100%;max-height:calc(100dvh - 10px - env(safe-area-inset-top) - env(safe-area-inset-bottom));padding:7px;border-radius:9px;font-size:.9em}.dialogHeader{top:-7px;margin:-7px -7px 6px;padding:6px 7px}.dialog h3{margin-top:8px;padding-top:6px}.settingGrid{grid-template-columns:minmax(7em,.85fr) minmax(8em,1.15fr);gap:5px 7px}.settingGrid label{font-size:.9em}.dialog button,.dialog input,.dialog select{min-height:2em;height:2em}.fileButtons{gap:4px}.dialogActions{margin-top:7px}.numericPad{width:min(230px,calc(100vw - 10px));padding:5px}.numericPadGrid button{height:2.1em}.numericPadDisplay{height:1.95em;margin-bottom:4px}}
.toast{position:fixed;z-index:7000;left:50%;bottom:calc(48px + env(safe-area-inset-bottom));transform:translateX(-50%);max-width:calc(100vw - 24px);padding:9px 14px;border-radius:999px;background:#111827;color:#fff;box-shadow:0 6px 20px rgba(0,0,0,.25);font-weight:700;font-size:.9em}
input[type=file]{display:none}
body.landscape-search-layout.search-pane-open main{margin-left:var(--search-pane-width,340px)}
body.landscape-search-layout .searchPanel:not(.hidden){position:static;width:auto;padding:0;background:transparent;border:0;display:flex;flex-direction:column;gap:6px}
body.landscape-search-layout .searchPanel .searchResults{position:fixed;z-index:30;left:4px;top:calc(var(--landscape-header-height,96px) + 2px);bottom:4px;width:calc(var(--search-pane-width,340px) - 8px);height:auto!important;max-height:none;min-height:72px;border-radius:0;border:2px solid transparent}
body.landscape-search-layout .searchPanel .searchResults.activePane{border-color:var(--active-pane);box-shadow:0 0 0 1px color-mix(in srgb,var(--active-pane) 35%,transparent)}

<body>
<header>
  <div class="topbar"><span id="appTitle">STEdit</span><span id="docTitle">新規文書.txt</span><span id="dirtyMark" class="hidden">●</span><span class="spacer"></span>
    <button id="fileBtn" class="iconBtn">File</button><button id="undoBtn" class="iconBtn historyIconBtn" title="元に戻す" aria-label="元に戻す"><svg viewBox="0 0 32 32" aria-hidden="true"><path class="historyHead" d="M13.5 5 3 14l10.5 9v-6H18v-6h-4.5z"/><path class="historyArc" d="M17 14a10 10 0 1 1-8.6 15.1"/></svg></button><button id="redoBtn" class="iconBtn historyIconBtn" title="やり直す" aria-label="やり直す"><svg viewBox="0 0 32 32" aria-hidden="true"><path class="historyHead" d="M18.5 5 29 14l-10.5 9v-6H14v-6h4.5z"/><path class="historyArc" d="M15 14a10 10 0 1 0 8.6 15.1"/></svg></button><button id="fontBtn" class="iconBtn">A+</button><button id="tabBtn" class="iconBtn">Tab</button><button id="searchBtn" class="iconBtn">検索</button><button id="settingsBtn" class="iconBtn">設定</button>
  </div>
  <div id="searchPanel" class="searchPanel hidden"><div class="searchRow"><div class="searchInputWrap"><input id="searchText" class="searchField" type="search" placeholder="検索文字列"><button id="searchClearBtn" class="clearInputBtn" aria-label="検索文字列を消去">×</button></div><button id="searchExecBtn" title="タップ:カーソル以降 / ダブルタップ:先頭から">🔍</button><button id="searchArrowBtn">→</button><span id="hitCounter" class="counter">0 / 0</span><button id="replaceToggleBtn">置換</button></div><div id="replaceRow" class="replaceRow hidden"><div class="searchInputWrap"><input id="replaceText" class="searchField" type="text" placeholder="置換文字列"><button id="replaceClearBtn" class="clearInputBtn" aria-label="置換文字列を消去">×</button></div><button id="replaceBtn">単置換</button><button id="replaceAllBtn">全置換</button></div><div id="searchResults" class="searchResults"><div id="searchResultsInner" class="searchResultsInner"><div class="searchEmpty">検索を実行してください</div></div></div><div id="paneResizeHandle" class="paneResizeHandle" title="ドラッグして検索ペーンの高さを変更"></div></div>
</header>
<main><div class="editorShell"><div id="virtualScroller"><div id="virtualCanvas"><div id="gutterLayer"></div><div id="cursorLine"></div><canvas id="searchCanvas"></canvas><textarea id="textAreaWindow" spellcheck="false" autocorrect="off" autocapitalize="off" autocomplete="off" wrap="soft" aria-label="本文編集"></textarea><canvas id="invisibleCanvas" class="hidden"></canvas><div id="persistentCaret" aria-hidden="true"></div></div></div><div id="scrollRail"><div id="navMarkers"></div><div id="scrollThumb"></div></div><div class="statusbar"><span id="statusPos">1行 1列</span><span id="statusCount">1行 0文字</span><span id="statusSelect">選択 0文字</span><span id="statusEngine">Virtual / 0行描画</span><span id="statusEncoding">UTF-8 / LF</span><span id="statusBackup">バックアップ済み</span></div></div></main>
<input id="fileInput" type="file" accept=".txt,.md,.markdown,.html,.htm,.css,.js,.json,.csv,.log,.xml,text/*">
<div id="fileMenu" class="popupMenu hidden"><div class="menuTitle">ファイル</div><button id="fileNewBtn">新規文書</button><button id="fileOpenBtn">ファイルを開く</button><button id="fileSaveBtn">ファイル保存</button><button id="fileSaveAsBtn">名前を付けて保存</button><div class="menuFooter"><button id="fileMenuCloseBtn">閉じる</button></div></div>
<div id="fontSizeMenu" class="assistMenu hidden" role="menu" aria-label="文字サイズ">
  <div class="menuTitle">文字サイズ <button id="fontSizeTopCloseBtn" class="dialogTopClose" style="float:right">×</button></div><div id="fontSizeGrid" class="assistGrid fontSizeGrid"></div>
  <div class="menuFooter"><button id="fontSizeMenuCloseBtn">閉じる</button></div>
</div>

// iPad Safariではキーボード表示時にlayout viewportが縮まず、visual viewportだけが縮む場合がある。

let viewportSyncFrame=0;
function ensureCaretVisibleAfterViewportChange(){
  if(document.activeElement!==editor)return;
  const p=offsetToPos(globalSelectionSafe().focus),pt=textPointInLine(p.line,p.col),lh=lineHeightPx(),y=lineTopPx(p.line)+pt.row*lh;
  const margin=Math.max(lh*1.5,28),top=scroller.scrollTop+margin,bottom=scroller.scrollTop+scroller.clientHeight-margin;
  if(y<top)scroller.scrollTop=Math.max(0,y-margin);
  else if(y+lh>bottom)scroller.scrollTop=Math.max(0,y+lh-scroller.clientHeight+margin);
}
function syncVisualViewport(){
  if(viewportSyncFrame)cancelAnimationFrame(viewportSyncFrame);
  viewportSyncFrame=requestAnimationFrame(()=>{
    viewportSyncFrame=0;
    const vv=window.visualViewport;
    const h=Math.max(240,Math.round(vv?vv.height:window.innerHeight));
    document.documentElement.style.setProperty("--visual-viewport-height",h+"px");
    // Safariの自動スクロールで文書自体が動くのを戻す。編集領域内のスクロールは維持される。
    if(window.scrollY!==0)window.scrollTo(0,0);
    markLayoutDirty();state.windowStart=-1;
    renderVirtual(true);
    requestAnimationFrame(()=>{ensureCaretVisibleAfterViewportChange();renderVirtual(false)});
  });
}
